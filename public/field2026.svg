  <rect x="17.498" y="0" width="0.05" height="8.052" fill="#ff4444" />

  <!-- Labels -->
  <text x="1.5" y="4.2" font-size="0.4" fill="white" text-anchor="middle" opacity="0.9">BLUE</text>
  <text x="16.0" y="4.2" font-size="0.4" fill="white" text-anchor="middle" opacity="0.9">RED</text>
  <text x="8.774" y="4.2" font-size="0.3" fill="white" text-anchor="middle" opacity="0.6">CENTER</text>

  <!-- Corner tick marks -->
  <line x1="0" y1="0" x2="0.3" y2="0" stroke="white" stroke-width="0.03" />
  <line x1="0" y1="0" x2="0" y2="0.3" stroke="white" stroke-width="0.03" />
  <line x1="17.548" y1="0" x2="17.248" y2="0" stroke="white" stroke-width="0.03" />
  <line x1="17.548" y1="0" x2="17.548" y2="0.3" stroke="white" stroke-width="0.03" />
  <line x1="0" y1="8.052" x2="0.3" y2="8.052" stroke="white" stroke-width="0.03" />
  <line x1="0" y1="8.052" x2="0" y2="7.752" stroke="white" stroke-width="0.03" />
  <line x1="17.548" y1="8.052" x2="17.248" y2="8.052" stroke="white" stroke-width="0.03" />
  <line x1="17.548" y1="8.052" x2="17.548" y2="7.752" stroke="white" stroke-width="0.03" />

